services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idemgate
      POSTGRES_USER: idemgate
      POSTGRES_PASSWORD: idemgate
    ports:
      - "5432:5432"
    volumes:
      - idemgate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idemgate -d idemgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  idemgate:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/idemgate
      SPRING_DATASOURCE_USERNAME: idemgate
      SPRING_DATASOURCE_PASSWORD: idemgate
      IDEMGATE_API_KEY: ${IDEMGATE_API_KEY:-dev-secret-change-me}
      IDEMGATE_OPS_USERNAME: ${IDEMGATE_OPS_USERNAME:-admin}
      IDEMGATE_OPS_PASSWORD: ${IDEMGATE_OPS_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    # API + Ops UI: http://localhost:8080/ui/

volumes:
  idemgate_pg:
