services:
  idemgate:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/idemgate.db
      IDEMGATE_DB_PATH: /data/idemgate.db
      IDEMGATE_API_KEY: ${IDEMGATE_API_KEY:-dev-secret-change-me}
      IDEMGATE_OPS_USERNAME: ${IDEMGATE_OPS_USERNAME:-admin}
      IDEMGATE_OPS_PASSWORD: ${IDEMGATE_OPS_PASSWORD:-admin}
    volumes:
      - idemgate_data:/data
    # API + Ops UI: http://localhost:8080/ui/

volumes:
  idemgate_data:
